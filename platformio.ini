; ESP32-S3 N16R8 Wireless Web-Based Game Boy
; 16MB flash + 8MB OPI PSRAM

[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions/n16r8_romlib.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
  ESP32Async/AsyncTCP @ ^3.3.2
  ESP32Async/ESPAsyncWebServer @ ^3.6.0
build_flags =
  -DMINIGB_APU_AUDIO_FORMAT_S16SYS
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Quiet logging — less CPU stolen by ESP_LOG / Arduino debug prints
  -DCORE_DEBUG_LEVEL=0
  ; MCU-friendly Peanut-GB: we only stream 2bpp DMG shades, and high LCD
  ; accuracy (sprite sort) is what often blows the frame budget in Pokémon text.
  -DPEANUT_GB_HIGH_LCD_ACCURACY=0
  -DPEANUT_GB_12_COLOUR=0
  -I include
; Bluetooth / BLE not used — keep them out of the link when present
lib_ignore =
  BluetoothSerial
  BLE
  WiFiProv
  ESP32 BLE Arduino

; Optional: pin a COM port if auto-detect picks the wrong device
; upload_port = COM14
; monitor_port = COM14

; Alias so older commands (-e esp32-s3) still work
[env:esp32-s3]
extends = env:esp32-s3-n16r8
